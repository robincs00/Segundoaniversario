<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestros 2 años</title>

  <!-- Tipografías: una serif elegante para los títulos y una sans-serif limpia para el texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== PORTADA ===================== -->
  <header class="hero" id="hero">
    <canvas id="hearts-canvas"></canvas>
    <div class="hero-content">
      <p class="hero-eyebrow">Desde el primer día que te vi, me enamoré</p>
      <h1 class="hero-title">Roberto <span class="amp">&amp;</span> María Karla</h1>
      <p class="hero-days" id="dias-juntos">Calculando días juntos…</p>
      <p class="hero-scroll">Sigue bajando ↓</p>
    </div>
  </header>

  <!-- ===================== LÍNEA DE MOMENTOS ===================== -->
  <main id="timeline">
    <!-- Los momentos se generan automáticamente desde script.js -->
  </main>

  <!-- ===================== CIERRE ===================== -->
  <footer class="final" id="final">
    <h2>Y esto apenas empieza…</h2>
    <p>Gracias por estos 2 años. Te amo.</p>
    <button id="btn-corazones">Toca aquí ❤</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
